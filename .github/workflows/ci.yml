name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Get Node.js version from package.json engines
        id: node-version
        run: echo "node_version=$(jq -r '.engines.node' package.json)" >> $GITHUB_OUTPUT

      - name: Install pnpm, Node.js, and Setup Cache
        uses: pnpm/action-setup@v4
        with:
          # Installs Node.js from package.json engines
          version: ${{ steps.node-version.outputs.node_version }}
          # Enables automatic global store caching
          cache: true

      - name: Install dependencies
        run:  pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium

      - name: Verify application
        run: pnpm verify