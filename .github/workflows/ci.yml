name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pnpm, Node.js, and Setup Cache
        uses: pnpm/action-setup@v4
        with:
          # Runtime syntax targets the Node version
          runtime: node@24
          # Enables automatic global store caching
          cache: true

      - name: Install dependencies
        run:  pnpm install --frozen-lockfile

      - name: Verify application
        run: npm run verify